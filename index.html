<!DOCTYPE html>
 
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лендинг</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">VS<span>Master</span></div>
        </nav>
    </header>

    <section id="profiles" class="profiles">
        <h2>Профили</h2>
        <form id="profileForm">
            <label for="profileName">Имя профиля</label><br>
            <input id="profileName" type="text" placeholder="Например: Лена" required><br><br>

            <label for="profileBio">О себе</label><br>
            <textarea id="profileBio" rows="3" placeholder="Коротко о себе"></textarea><br><br>

            <button type="submit">Создать профиль</button>
        </form>
        <br>
        <label for="activeProfile">Активный профиль</label><br>
        <select id="activeProfile">
            <option value="">Без профиля</option>
        </select>

        <div id="profilesList"></div>
    </section>

    <section id="posts" class="posts">
        <h2>Посты сообщества</h2>
        <form id="postForm">
            <label for="postAuthor">Ваше имя</label><br>
            <input id="postAuthor" type="text" placeholder="Например: Лена" required><br><br>

            <label for="postText">Текст поста</label><br>
            <textarea id="postText" rows="4" placeholder="Напишите ваш пост..." required></textarea><br><br>

            <label for="postImage">Фото к посту</label><br>
            <input id="postImage" type="file" accept="image/*"><br><br>

            <button type="submit">Опубликовать пост</button>
        </form>

        <div id="postsList"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
