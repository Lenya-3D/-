<!DOCTYPE html>
 
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лендинг</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="gameEntry" class="game-entry-screen">
        <div class="game-entry-card">
            <h1>VS Master</h1>
            <p>Нажмите кнопку, чтобы войти на главную страницу</p>
            <button id="enterSiteButton" type="button">Войти в сайт</button>
        </div>
    </section>

    <div id="appContent">
    <header>
        <nav>
            <div class="logo">VS<span>Master</span></div>
            <div id="siteTabs" class="site-tabs">
                <button type="button" class="site-tab active" data-tab-target="desktop">Рабочий стол</button>
                <button type="button" class="site-tab" data-tab-target="profiles">Профили</button>
                <button type="button" class="site-tab" data-tab-target="posts">Посты</button>
            </div>
            <button id="exitSiteButton" type="button">Выйти в меню</button>
        </nav>
    </header>

    <section id="desktop" class="desktop tab-content">
        <h2>Галерея рабочего стола</h2>
        <p>Выберите фон из галереи:</p>
        <div id="desktopGallery" class="desktop-gallery">
            <button type="button" class="desktop-thumb" data-bg="linear-gradient(135deg, #f4f6fb, #dbeafe)" aria-label="Светло-голубой фон"></button>
            <button type="button" class="desktop-thumb" data-bg="linear-gradient(135deg, #fef3c7, #fde68a)" aria-label="Теплый фон"></button>
            <button type="button" class="desktop-thumb" data-bg="linear-gradient(135deg, #dcfce7, #bbf7d0)" aria-label="Зеленый фон"></button>
            <button type="button" class="desktop-thumb" data-bg="linear-gradient(135deg, #e9d5ff, #c4b5fd)" aria-label="Фиолетовый фон"></button>
            <button type="button" class="desktop-thumb" data-bg="linear-gradient(135deg, #111827, #1f2937)" aria-label="Темный фон"></button>
        </div>
        <div class="desktop-custom">
            <label for="customDesktopImage">Своя картинка для фона</label><br>
            <input id="customDesktopImage" type="file" accept="image/*">
            <button id="applyDesktopImage" type="button">Поставить как фон</button>
        </div>
    </section>

    <section id="profiles" class="profiles tab-content">
        <h2>Профили</h2>
        <form id="profileForm">
            <label for="profileName">Имя профиля</label><br>
            <input id="profileName" type="text" placeholder="Например: Лена" required><br><br>

            <label for="profileBio">О себе</label><br>
            <textarea id="profileBio" rows="3" placeholder="Коротко о себе"></textarea><br><br>

            <label for="profileAvatar">Иконка профиля</label><br>
            <input id="profileAvatar" type="file" accept="image/*"><br><br>

            <button type="submit">Создать профиль</button>
        </form>
        <br>
        <label for="activeProfile">Активный профиль</label><br>
        <select id="activeProfile">
            <option value="">Без профиля</option>
        </select>

        <div id="profilesList"></div>
    </section>

    <section id="posts" class="posts tab-content">
        <h2>Посты сообщества</h2>
        <form id="postForm">
            <label for="postAuthor">Ваше имя</label><br>
            <input id="postAuthor" type="text" placeholder="Например: Лена" required><br><br>

            <label for="postText">Текст поста</label><br>
            <textarea id="postText" rows="4" placeholder="Напишите ваш пост..." required></textarea><br><br>

            <label for="postImage">Фото к посту</label><br>
            <input id="postImage" type="file" accept="image/*"><br><br>

            <label for="postVideo">Видео к посту</label><br>
            <input id="postVideo" type="file" accept="video/*"><br><br>

            <label for="postAudio">Аудио к посту</label><br>
            <input id="postAudio" type="file" accept="audio/*"><br>
            <div class="audio-record-controls">
                <button id="startAudioRecord" type="button">Начать запись</button>
                <button id="stopAudioRecord" type="button" disabled>Остановить запись</button>
            </div><br>

            <label for="postLink">Ссылка на сайт или группу</label><br>
            <input id="postLink" type="url" placeholder="Например: https://vk.com/..." ><br><br>

            <button type="submit">Опубликовать пост</button>
        </form>

        <div id="postsList"></div>
    </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
